<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibeset — Vanilla Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: oklch(0.08 0 0);
        --fg: oklch(0.95 0 0);
        --muted: oklch(0.55 0 0);
        --accent: oklch(0.7 0.2 45);
        --accent-border: oklch(0.7 0.2 45 / 0.6);
        --border-rest: oklch(0.25 0 0 / 0.4);
        --font-display: "IBM Plex Sans", sans-serif;
        --font-flap: "Bebas Neue", "IBM Plex Sans", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-display);
        background: var(--bg);
        color: var(--fg);
      }

      /* ── Layout ────────────────────────────────────────────── */

      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Sphere — absolute top-right */
      .sphere-wrap {
        position: absolute;
        top: 0;
        right: 0;
        pointer-events: none;
        z-index: 1;
      }

      .sphere-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0.65;
        pointer-events: none;
      }

      /* Hero section */
      .hero {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 48px 48px 24px 48px;
        align-items: center;
        min-height: 0;
        position: relative;
        z-index: 2;
      }

      .hero-left {
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .hero-tag {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .hero-slogan {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 500;
        color: var(--accent);
        line-height: 1.3;
      }

      .hero-desc {
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        max-width: 460px;
      }

      .hero-btn {
        align-self: flex-start;
        padding: 12px 24px;
        border: 1px solid var(--accent-border);
        background: transparent;
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 200ms ease;
      }

      .hero-btn:hover {
        background: var(--accent);
        color: var(--bg);
      }

      /* ── Flip title ──────────────────────────────────────── */

      .flip-title {
        display: flex;
        align-items: center;
        font-family: var(--font-flap);
        font-size: clamp(64px, 14vw, 200px);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.05;
        gap: 1px;
        cursor: pointer;
        perspective: 1000px;
      }

      .flip-space {
        width: 0.3em;
        font-size: clamp(4rem, 14vw, 14rem);
      }

      .flip-char {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-flap);
        font-size: clamp(4rem, 14vw, 14rem);
        width: 0.58em;
        padding: 0 0.04em;
        height: 1.05em;
        transform-style: preserve-3d;
        transition: background-color 0.15s ease;
      }

      .flip-char .midline {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        margin-top: -1px;
        background: rgba(0, 0, 0, 0.2);
        pointer-events: none;
        z-index: 10;
      }

      .flip-char .half-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 50%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
      }

      .flip-char .half-top span {
        display: block;
        transform: translateY(0.52em);
        line-height: 1;
        transition: color 150ms ease;
      }

      .flip-char .half-bottom {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        bottom: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
      }

      .flip-char .half-bottom span {
        transform: translateY(-0.52em);
        line-height: 1;
        transition: color 150ms ease;
      }

      .flip-char .flap-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 50%;
        transform-origin: bottom;
        overflow: hidden;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: background-color 0.15s ease;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .flap-top span {
        transform: translateY(0.52em);
        line-height: 1;
        transition: color 150ms ease;
      }

      @keyframes flapIn {
        from {
          transform: rotateX(-90deg);
        }
        to {
          transform: rotateX(0deg);
        }
      }

      @keyframes tileEnter {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Flow cards ──────────────────────────────────────── */

      .flow-footer {
        height: 180px;
        padding: 0 48px 24px 48px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        flex-shrink: 0;
        position: relative;
        z-index: 2;
      }

      .flow-card {
        position: relative;
        border: 1px solid var(--border-rest);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        cursor: pointer;
        overflow: hidden;
        background: transparent;
      }

      .flow-card .card-tag {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--muted);
        transition: color 300ms ease;
      }

      .flow-card .card-title {
        margin-top: 8px;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--fg);
        transition: color 300ms ease, transform 300ms ease;
      }

      .flow-card .card-desc {
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 300ms ease, transform 300ms ease;
      }

      .flow-card .card-desc p {
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
      }

      .flow-card .card-desc p + p {
        margin-top: 2px;
      }

      .flow-card .corner-mark {
        position: absolute;
        top: 0;
        right: 0;
        width: 20px;
        height: 20px;
        opacity: 0;
        transition: opacity 300ms ease;
        pointer-events: none;
      }

      .flow-card .corner-mark::before,
      .flow-card .corner-mark::after {
        content: "";
        position: absolute;
        background: var(--accent);
      }

      .flow-card .corner-mark::before {
        top: 0;
        right: 0;
        width: 100%;
        height: 1px;
      }

      .flow-card .corner-mark::after {
        top: 0;
        right: 0;
        width: 1px;
        height: 100%;
      }

      /* Hover states — driven by .hovered class (JS toggles it) */
      .flow-card.hovered {
        border-color: var(--accent-border);
      }

      .flow-card.hovered .card-tag {
        color: var(--accent);
      }

      .flow-card.hovered .card-title {
        color: var(--accent);
      }

      .flow-card.hovered .card-desc {
        opacity: 1;
        transform: translateY(0);
      }

      .flow-card.hovered .corner-mark {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- ASCII Sphere -->
      <div class="sphere-wrap" id="ascii-sphere">
        <canvas id="sphere-canvas"></canvas>
      </div>

      <!-- Hero -->
      <main class="hero">
        <div class="hero-left">
          <span class="hero-tag">v.01 / Live Demo</span>

          <div class="flip-title" id="hero-flap"></div>

          <p class="hero-slogan">感觉即代码</p>

          <p class="hero-desc">
            下面这些动效，自然语言能描述准吗?<br />
            点右下角「动效编辑」打开面板，亲自调一下感觉。
          </p>

          <button class="hero-btn">试试编辑动效 →</button>
        </div>

        <!-- Right column placeholder (sphere is absolute) -->
        <div></div>
      </main>

      <!-- Flow cards -->
      <footer class="flow-footer" id="flow-cards">
        <article class="flow-card" data-index="0">
          <div>
            <span class="card-tag">01 / 嵌入预览</span>
            <h3 class="card-title">EMBED</h3>
          </div>
          <div class="card-desc">
            <p>画板嵌入产品代码，跟着部署上预览。</p>
            <p>一行接入，热插拔上线即可移除。</p>
          </div>
          <div class="corner-mark"></div>
        </article>

        <article class="flow-card" data-index="1">
          <div>
            <span class="card-tag">02 / 调感觉旋钮</span>
            <h3 class="card-title">TUNE</h3>
          </div>
          <div class="card-desc">
            <p>选元素，出面板，跟着感觉拖滑杆。</p>
            <p>用自然语言增删参数，让 AI 改 schema。</p>
          </div>
          <div class="corner-mark"></div>
        </article>

        <article class="flow-card" data-index="2">
          <div>
            <span class="card-tag">03 / 实时映射</span>
            <h3 class="card-title">PREVIEW</h3>
          </div>
          <div class="card-desc">
            <p>调参实时生效，画面立刻反馈。</p>
            <p>感觉即代码，零翻译损耗。</p>
          </div>
          <div class="corner-mark"></div>
        </article>

        <article class="flow-card" data-index="3">
          <div>
            <span class="card-tag">04 / AI 协作出码</span>
            <h3 class="card-title">SHIP</h3>
          </div>
          <div class="card-desc">
            <p>复制变更，发给 AI 改 default。</p>
            <p>刷新代码，调整即完成上线。</p>
          </div>
          <div class="corner-mark"></div>
        </article>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
